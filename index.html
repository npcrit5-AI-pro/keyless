<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyless: search across free APIs</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
    10|:root{--paper:#EEF1EC;--ink:#17231E;--moss:#2E5E4E;--rust:#B4532A;--rule:#C9D1CA;--muted:#5E6B64;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121A16;--ink:#E4EBE5;--moss:#8FC7AE;--rust:#E08A5E;--rule:#2C3A33;--muted:#9AA89F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121A16;--ink:#E4EBE5;--moss:#8FC7AE;--rust:#E08A5E;--rule:#2C3A33;--muted:#9AA89F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:40px 20px 80px}
h1{font:700 40px/1.05 Fraunces,Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 28px}
form{display:flex;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
input{flex:1;min-width:0;font:500 20px "Source Sans 3",system-ui,sans-serif;background:transparent;border:0;color:var(--ink);padding:6px 0;outline:none}
input::placeholder{color:var(--muted)}
button{font:600 16px "Source Sans 3",system-ui,sans-serif;background:var(--moss);color:var(--paper);border:0;border-radius:4px;padding:8px 16px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--rust);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.chips button{background:transparent;color:var(--moss);border:1px solid var(--rule);padding:4px 10px;font-weight:400;font-size:15px}
.routing{margin:28px 0 0;color:var(--muted);font-size:15px}
.routing b{color:var(--ink);font-weight:600}
h3.group{font:700 13px "Source Sans 3",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:36px 0 0;border-bottom:1px solid var(--rule);padding-bottom:4px}
section.src{border-left:3px solid var(--moss);padding:4px 0 4px 18px;margin:22px 0}
section.src.fail{border-left-color:var(--rust)}
.src h2{font:700 21px Fraunces,Georgia,serif;margin:0 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:14px;margin-bottom:10px}
.meta b{color:var(--moss);font-weight:600}
.badge{font:600 11px/1 "Source Sans 3",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--moss);border:1px solid var(--moss);border-radius:999px;padding:3px 8px;white-space:nowrap}
.badge.proxy{color:var(--rust);border-color:var(--rust)}
ol.results{list-style:none;padding:0;margin:0}
ol.results li{padding:10px 0;border-top:1px solid var(--rule)}
ol.results li:first-child{border-top:0}
ol.results a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--rule)}
ol.results a:hover{border-bottom-color:var(--moss)}
ol.results p{margin:3px 0 0;color:var(--muted);font-size:15px}
dl.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 0;font-size:14px}
dl.facts div{display:flex;gap:4px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:600}
.empty{color:var(--muted);font-size:15px;margin:0}
details{margin-top:48px;border-top:1px solid var(--rule);padding-top:14px}
summary{cursor:pointer;color:var(--moss);font-weight:600}
.filter{display:flex;gap:10px;align-items:center;margin:14px 0 0;font-size:15px;color:var(--muted)}
select{font:500 15px "Source Sans 3",system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;max-width:100%}
.catalog{list-style:none;padding:0;margin:12px 0 0;font-size:15px;color:var(--muted)}
.catalog li{padding:7px 0;border-top:1px solid var(--rule)}
.catalog .cat-head{font:700 13px "Source Sans 3",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--moss);border-top:0;padding-top:18px}
.catalog b{color:var(--ink);font-weight:600}
.catalog a{color:var(--moss)}
.catalog .sample{font-style:italic}
</style>
</head>
<body>
<main>
  <h1>Keyless</h1>
  <p class="lede">Ask a question. We pick the free sources that fit, with no keys to set up, and lay out what they return.</p>

  <form id="f" role="search">
    <input id="q" type="search" placeholder="weather in Lisbon, define serendipity, 100 USD to EUR" aria-label="Search" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <ul class="chips" id="chips"></ul>

  <div id="out" aria-live="polite"></div>

  <details>
    <summary>Sources in this build (<span id="total">0</span>)</summary>
    <p class="meta" id="summary"></p>
    <label class="filter">Category
      <select id="catFilter"></select>
    </label>
    <ul class="catalog" id="cat"></ul>
  </details>
</main>

<script src="core/keyless.js"></script>
<script src="core/router.js"></script>
<script src="apis/books.js"></script>
<script src="apis/news.js"></script>
<script src="apis/reference.js"></script>
<script src="apis/language.js"></script>
<script src="apis/weather.js"></script>
<script src="apis/disasters.js"></script>
<script src="apis/science.js"></script>
<script src="apis/space.js"></script>
<script src="apis/geo.js"></script>
<script src="apis/finance.js"></script>
<script src="apis/food.js"></script>
<script src="apis/animals.js"></script>
<script src="apis/music.js"></script>
<script src="apis/film.js"></script>
<script src="apis/games.js"></script>
<script src="apis/sports.js"></script>
<script src="apis/health.js"></script>
<script src="apis/government.js"></script>
<script src="apis/environment.js"></script>
<script src="apis/art.js"></script>
<script src="apis/media.js"></script>
<script src="apis/internet.js"></script>
<script src="apis/dev.js"></script>
<script src="apis/fun.js"></script>
<script src="apis/time.js"></script>
<script src="apis/travel.js"></script>
<script>
(function () {
  'use strict';
  const K = window.Keyless;
  const SOURCE_BUDGET_MS = 8000;
  const EXAMPLES = [
    'weather in Lisbon', 'define serendipity', '100 USD to EUR', 'bitcoin price',
    'earthquakes', 'Marie Curie', 'nfl scores', 'tell me a joke', 'chicken recipe', 'ISS position',
  ];
  const CATEGORY_LABEL = Object.fromEntries(K.categories.map(c => [c.key, c.label]));
  let searchId = 0;

  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    n.append(...kids.flat().filter(k => k != null && k !== false));
    return n;
  };

  async function detectProxy() {
    if (!/^https?:$/.test(location.protocol)) return false;
    try {
      const r = await fetch('/__keyless/status', { cache: 'no-store' });
      if (!r.ok) return false;
      const j = await r.json();
      if (!j.proxy) return false;
      K.config.proxy = '';
      return true;
    } catch (e) {
      return false;
    }
  }
  const proxyReady = detectProxy();

  function routingLine(plan) {
    const parts = [];
    parts.push(plan.fallback
      ? 'Nothing matched directly, so general sources were queried.'
      : ['Picked ', el('b', {}, String(plan.picks.length)), ` of ${plan.available} available sources.`]);
    if (plan.intents.length) parts.push(` Topics: ${plan.intents.join(', ')}.`);
    const skipped = K.config.proxy == null ? K.sources.filter(s => s.proxy).length : 0;
    if (skipped) parts.push(` ${skipped} proxy-only sources skipped; run "node server.js" to enable them.`);
    return el('p', { class: 'routing' }, ...parts);
  }

  function factsOf(item) {
    if (!Array.isArray(item.facts) || !item.facts.length) return null;
    return el('dl', { class: 'facts' }, item.facts.map(([k, v]) => el('div', {}, el('dt', {}, k), el('dd', {}, String(v)))));
  }

  function sourceCard(pick, outcome) {
    const s = pick.source;
    const failed = outcome.status === 'rejected';
    const meta = el('div', { class: 'meta' },
      pick.hits.length ? ['Matched on ', el('b', {}, pick.hits.join(', '))] : 'General fallback',
      ' · ', el('span', { class: 'badge' + (s.proxy ? ' proxy' : '') }, s.proxy ? 'proxy' : 'direct'));
    const sec = el('section', { class: 'src' + (failed ? ' fail' : '') }, el('h2', {}, s.name), meta);
    if (failed) {
      sec.append(el('p', { class: 'empty' }, 'Could not get results: ' + outcome.reason.message));
    } else if (!outcome.value.length) {
      sec.append(el('p', { class: 'empty' }, 'No results.'));
    } else {
      sec.append(el('ol', { class: 'results' }, outcome.value.map(it => el('li', {},
        el('a', { href: it.link, target: '_blank', rel: 'noopener' }, it.title),
        it.body ? el('p', {}, it.body) : null,
        factsOf(it)))));
    }
    return sec;
  }

  async function search(raw) {
    const q = raw.trim();
    if (!q) return;
    const id = ++searchId;
    const out = $('out');
    out.replaceChildren(el('p', { class: 'routing' }, 'Searching…'));
    await proxyReady;
    if (id !== searchId) return;

    const plan = K.route(q);
    out.replaceChildren(routingLine(plan));
    const outcomes = await Promise.allSettled(
      plan.picks.map(p => K.withTimeout(p.source.run(q), SOURCE_BUDGET_MS)));
    if (id !== searchId) return;

    const groups = new Map();
    plan.picks.forEach((pick, i) => {
      const key = pick.source.category;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(sourceCard(pick, outcomes[i]));
    });
    for (const [key, cards] of groups) {
      out.append(el('h3', { class: 'group' }, CATEGORY_LABEL[key] || key), ...cards);
    }
  }

  function renderChips() {
    $('chips').replaceChildren(...EXAMPLES.map(ex => el('li', {}, el('button', { type: 'button' }, ex))));
  }

  function renderCatalog(filter) {
    const shown = K.categories.filter(c => filter === 'all' || c.key === filter);
    $('cat').replaceChildren(...shown.flatMap(c => {
      const items = K.sources.filter(s => s.category === c.key);
      return [
        el('li', { class: 'cat-head' }, `${c.label} · ${items.length}`),
        ...items.map(s => el('li', {},
          el('b', {}, s.name), ' ',
          el('span', { class: 'badge' + (s.proxy ? ' proxy' : '') }, s.proxy ? 'proxy' : 'direct'),
          ' · e.g. ', el('span', { class: 'sample' }, s.sample || ''),
          ' · ', el('a', { href: s.home, target: '_blank', rel: 'noopener' }, 'site'))),
      ];
    }));
  }

  function renderFilter() {
    $('catFilter').replaceChildren(
      el('option', { value: 'all' }, `All categories (${K.sources.length})`),
      ...K.categories.map(c => el('option', { value: c.key },
        `${c.label} (${K.sources.filter(s => s.category === c.key).length})`)));
  }

  $('total').textContent = String(K.sources.length);
  $('summary').textContent = `${K.sources.length} free sources across ${K.categories.length} categories. No keys or sign-ups. Proxy-only sources need "node server.js".`;
  renderFilter();
  renderCatalog('all');
  renderChips();
  $('catFilter').addEventListener('change', e => renderCatalog(e.target.value));
  $('chips').addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    $('q').value = e.target.textContent;
    search(e.target.textContent);
  });
  $('f').addEventListener('submit', e => { e.preventDefault(); search($('q').value); });
})();
</script>
</body>
</html>
